<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Mission for Mycutiee 💗</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
</head>
<body>
    <audio id="bgMusic" src="musik.mp3" loop></audio>

    <div id="quiz-screen">
        <div class="quiz-box">
            <div class="emoji-bounce">👀❓</div>
            <h2>Verifikasi Keamanan Sistem</h2>
            <p>Apakah kamu benar perempuan paling cantik, gemesin, dan kesayangan aku yang bernama <strong>mycutiee</strong>?</p>
            <div class="btn-group">
                <button id="yesBtn">Iya Dong! 🥰</button>
                <button id="noBtn">Enggak 😜</button>
            </div>
        </div>
    </div>

    <div id="main-screen" class="hidden">
        <div id="glow-particles"></div>
        
        <div class="wrapper">
            <div class="polaroid">
                <img src="mycutiee.jpg.jpeg" alt="My Cutiee">
                <div class="tag">Happy Sweet 18th, Sayang! 🌸</div>
            </div>

            <h1 class="sparkle-text">Happy 18th Birthday,<br><span class="nickname">mycutiee💗💗</span></h1>
            
            <div id="story-text" class="romantic-story"></div>

            <button id="celebrateBtn">Kirim Peluk & Cium 👑</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
